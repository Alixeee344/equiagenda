<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EquiAgenda">
<meta name="description" content="La tua agenda personale per il tuo cavallo.">
<title>EquiAgenda 🐴</title>
<style>
:root{--pink:#f5c8da;--pink-soft:#fff0f5;--pink-light:#fff7fa;--pink-deep:#a9577c;--ink:#753b55;--text:#503643;--muted:#937381;--line:#f1dbe4;--white:#fff;--shadow:0 12px 36px #a9577c12}
*{box-sizing:border-box}html{min-height:100%;background:#fff5f9}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,#ffe9f2,transparent 45%),linear-gradient(#fff8fb,#fff4f9);min-height:100dvh;font-size:15px}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d77ca6;outline-offset:2px}
.app{max-width:560px;margin:auto;min-height:100dvh;padding:0 17px calc(114px + env(safe-area-inset-bottom))}.top{padding:22px 1px 12px;display:flex;justify-content:space-between;align-items:center;gap:14px}.logo{display:flex;align-items:center;gap:10px}.mark{height:44px;width:44px;display:grid;place-items:center;background:linear-gradient(145deg,#f3aac8,#f8d6e3);border:1px solid #efafc8;border-radius:17px;font-size:25px;box-shadow:0 6px 18px #d490af33}.brand{font-weight:800;font-size:21px;letter-spacing:-.7px;color:#8c4366}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.round-btn{border:1px solid var(--line);background:#fff;border-radius:15px;min-width:42px;min-height:42px;color:var(--ink);font-size:19px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:800;color:#ad6c8a}.headline{font-size:29px;line-height:1.16;color:var(--ink);letter-spacing:-.8px;margin:9px 0 5px}.intro{color:var(--muted);margin:0 0 19px;line-height:1.5}.card{background:var(--white);border:1px solid #f3e1e8;border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#f7c8da,#fff0f6);border:1px solid #f4c1d5;border-radius:25px;padding:19px;display:flex;align-items:center;gap:12px;margin-bottom:15px;min-height:143px;box-shadow:var(--shadow)}.horse-art{border-radius:18px;min-width:106px;width:106px;height:106px;background:#fff7fb;display:grid;place-items:center;font-size:55px;overflow:hidden;box-shadow:0 4px 12px #bf749022}.horse-art img{width:100%;height:100%;object-fit:cover}.hero .eyebrow{color:#8f4f6f}.hero h2{font-size:25px;line-height:1.1;margin:6px 0;color:#763b59;overflow-wrap:anywhere}.hero p{font-size:12px;margin:5px 0 0;line-height:1.5;color:#8f5570}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 11px;gap:9px}.section-head h2{margin:0;font-size:17px;color:var(--ink)}.link-btn{padding:6px 9px;border:0;color:var(--pink-deep);background:transparent;font-weight:700;font-size:12px}.mini-label{font-size:12px;color:var(--muted);margin:0 0 5px}.big-number{font-size:29px;font-weight:800;color:var(--ink)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats .card{margin:0;padding:16px}.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:#fff1f6;color:#a35578;font-size:11px;font-weight:750}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f6e8ee}.item:last-child{border-bottom:0;padding-bottom:1px}.item:first-child{padding-top:2px}.item-ico{width:42px;height:42px;flex:none;display:grid;place-items:center;background:#fff0f5;border-radius:14px;font-size:20px}.item-main{min-width:0;flex:1}.item-title{font-weight:750;color:#77415c;font-size:14px;overflow-wrap:anywhere}.item-sub{color:var(--muted);font-size:12px;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}.item-action{font-size:12px;border:1px solid #f1dce5;background:white;border-radius:12px;padding:8px 10px;color:var(--pink-deep);font-weight:700}.empty{text-align:center;color:#9a7b89;padding:22px 10px;line-height:1.6;font-size:13px}.empty span{display:block;font-size:32px;margin-bottom:6px}.primary{border:0;border-radius:16px;padding:14px 17px;background:#bd6f95;color:#fff;font-weight:750;font-size:14px;box-shadow:0 6px 14px #bd6f9533}.primary:active{transform:scale(.98)}.secondary{background:#fff;border:1px solid #eac6d8;color:#9d5277;border-radius:15px;padding:12px 15px;font-weight:700}.wide{width:100%}.soft{background:#fff3f8;border:1px solid #f3d8e5;padding:14px 16px;border-radius:17px;color:#8f5270;line-height:1.55;font-size:13px}.profile{display:grid;gap:0}.field-row{display:flex;justify-content:space-between;padding:13px 1px;border-bottom:1px solid #f6e9ee;gap:20px}.field-row:last-child{border:0}.field-name{color:#8e7080;font-size:13px}.field-value{text-align:right;color:#74415a;font-weight:650;font-size:13px;overflow-wrap:anywhere;max-width:58%}.fab-wrap{margin:15px 0}.month-row{display:flex;justify-content:space-between;align-items:center;margin:0 0 15px}.month-row strong{color:#7e4762;font-size:17px}.month-nav{border:1px solid #f2dce5;background:#fff8fb;border-radius:12px;width:35px;height:35px;color:#954f72;font-size:23px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.week-day{color:#af8a9c;font-size:11px;font-weight:700;padding:9px 0}.day{position:relative;min-height:41px;border:0;background:transparent;color:#795167;border-radius:12px;font-weight:650}.day.marked::after{content:"";position:absolute;bottom:5px;left:calc(50% - 2px);width:4px;height:4px;border-radius:99px;background:#d383a5}.day.today{background:#fff1f7}.day.chosen{background:#b96e93;color:white}.day.chosen::after{background:#fff}.day.blank{visibility:hidden}.notes{white-space:pre-wrap;overflow-wrap:anywhere}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid #f1dce5;padding:7px max(10px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));z-index:3}.bottom-inner{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.nav{border:0;background:transparent;color:#aa8a99;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;min-height:55px;border-radius:13px}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav span{font-size:10px;font-weight:700}.nav.active{background:#fff0f6;color:#a5577b}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);border-radius:12px;background:#744058;color:#fff;padding:12px 18px;font-size:13px;z-index:8;box-shadow:0 7px 28px #53233933;max-width:90vw}.hidden{display:none!important}
dialog{border:0;border-radius:24px;padding:0;width:calc(100% - 30px);max-width:520px;max-height:88dvh;box-shadow:0 25px 75px #5c314c4d;background:#fff9fb;color:var(--text)}dialog::backdrop{background:#4d263988;backdrop-filter:blur(3px)}.dialog-head{padding:20px 20px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:19px;color:var(--ink);margin:0}.dialog-body{padding:17px 20px 22px;overflow:auto;max-height:calc(88dvh - 70px)}.input-group{display:block;margin-bottom:16px}.input-group>span{display:block;font-size:12px;font-weight:750;color:#85516a;margin:0 0 7px}.input-group input,.input-group select,.input-group textarea{width:100%;border:1px solid #edcfdd;border-radius:13px;background:#fff;padding:12px 13px;color:#593e4c;min-height:45px}.input-group textarea{min-height:90px;resize:vertical}.action-row{display:flex;gap:10px}.action-row button{flex:1}.danger{color:#b13c66;border-color:#efcbd8}.small-tip{font-size:12px;line-height:1.6;color:#977d89;margin-top:13px}.upload{text-align:center;border:1px dashed #e0b4c8;background:#fff3f8;border-radius:16px;padding:16px 14px;margin-bottom:15px}.upload input{max-width:100%;font-size:12px}.footer-note{font-size:11px;color:#ae899a;text-align:center;margin:18px 8px;line-height:1.6}@media(min-width:760px){.top{padding-top:30px}.app{padding-left:25px;padding-right:25px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo"><div class="mark">🐴</div><div><div class="brand">EquiAgenda</div><div class="subtitle">Il mondo del tuo cavallo, in ordine ♡</div></div></div><button class="round-btn" id="backupBtn" title="Backup e ripristino" aria-label="Backup e ripristino">⚙️</button></header>
<main id="view"></main>
<div class="footer-note">Creato con ♡ per te e il tuo cavallo.</div>
</div>
<nav class="bottom" aria-label="Navigazione principale"><div class="bottom-inner" id="nav"></div></nav>
<dialog id="editor" aria-labelledby="modalTitle"><div class="dialog-head"><h2 id="modalTitle">Nuovo elemento</h2><button class="round-btn" id="closeModal" type="button" aria-label="Chiudi">×</button></div><div class="dialog-body"><form id="entryForm"></form></div></dialog>
<input id="backupInput" type="file" accept=".json,application/json" class="hidden" aria-label="Importa backup">
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='equiagenda_v1';
const defaults=()=>({horse:{name:'',breed:'',birth:'',coat:'',notes:'',photo:''},appointments:[],diary:[],expenses:[]});
let state;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');state=saved&&typeof saved==='object'?{...defaults(),...saved,horse:{...defaults().horse,...(saved.horse||{})}}:defaults()}catch{state=defaults()}
for(const k of ['appointments','diary','expenses'])if(!Array.isArray(state[k]))state[k]=[];
let tab='home',shownMonth=new Date();shownMonth.setDate(1);let selectedDay='';
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v)||0);
const dateText=s=>{if(!s)return 'Data da aggiungere';const d=new Date(s+'T12:00:00');return Number.isNaN(d.valueOf())?s:new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long',year:'numeric'}).format(d)};
const shortDate=s=>{if(!s)return '';const d=new Date(s+'T12:00:00');return Number.isNaN(d.valueOf())?s:new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'}).format(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notice('Spazio esaurito: esporta un backup e riduci la foto.');return false}}
let toastTimer;function notice(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3000)}
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',horse:'<path d="M20.8 4.6a5.4 5.4 0 0 0-7.7 0L12 5.7l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6z"/>',agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',diary:'<path d="M4 5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2zM4 18a2 2 0 0 1 2-2h14M8 7h8M8 11h7"/>',expenses:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 15h2"/>'};
const navData=[['home','Home'],['horse','Cavallo'],['agenda','Agenda'],['diary','Diario'],['expenses','Spese']];
function renderNav(){$('#nav').innerHTML=navData.map(([id,label])=>`<button type="button" data-tab="${id}" class="nav ${tab===id?'active':''}" aria-label="${label}" ${tab===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg><span>${label}</span></button>`).join('')}
const horseName=()=>state.horse.name?.trim()||'Il tuo cavallo';
const sortedEvents=()=>[...state.appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const entries=(arr,fun,empty)=>arr.length?arr.map(fun).join(''):`<div class="empty"><span>🌷</span>${empty}</div>`;
function cardItem(icon,title,subtitle,action,kind,id){return `<div class="item"><div class="item-ico">${icon}</div><div class="item-main"><div class="item-title">${esc(title)}</div><div class="item-sub">${esc(subtitle)}</div></div>${action?`<button class="item-action" data-edit="${kind}" data-id="${esc(id)}">Modifica</button>`:''}</div>`}
function homeView(){const future=sortedEvents().filter(a=>a.date>=today());const month=today().slice(0,7);const spent=state.expenses.filter(x=>(x.date||'').startsWith(month)).reduce((s,x)=>s+Number(x.amount||0),0);
return `<div class="eyebrow">La tua scuderia digitale</div><h1 class="headline">Ciao, bentornata! ♡</h1><p class="intro">Tutti i tuoi ricordi e impegni, in un posto speciale.</p><div class="hero"><div class="horse-art">${state.horse.photo?`<img src="${esc(state.horse.photo)}" alt="Foto del cavallo">`:'🐴'}</div><div><div class="eyebrow">La mia stella</div><h2>${esc(horseName())}</h2><p>${state.horse.breed?esc(state.horse.breed):'Il tuo compagno di avventure'}</p><button class="link-btn" data-tab="horse">Vai alla scheda ›</button></div></div><div class="stats"><div class="card"><p class="mini-label">📅 Appuntamenti futuri</p><div class="big-number">${future.length}</div></div><div class="card"><p class="mini-label">💗 Spese del mese</p><div class="big-number" style="font-size:22px">${euro(spent)}</div></div></div><div class="section-head"><h2>Prossimi appuntamenti</h2><button class="link-btn" data-tab="agenda">Vedi tutti ›</button></div><div class="card">${entries(future.slice(0,3),a=>cardItem('📆',a.type,shortDate(a.date)+(a.time?' · '+a.time:'')+(a.notes?' · '+a.notes:''),false),'Nessun appuntamento in programma.<br>La tua agenda è pronta!')}</div><div class="section-head"><h2>Ultime attività</h2><button class="link-btn" data-tab="diary">Apri diario ›</button></div><div class="card">${entries([...state.diary].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2),a=>cardItem('🎀',a.type,shortDate(a.date)+(a.duration?' · '+a.duration+' minuti':''),false),'Inizia a raccontare le vostre giornate!')}</div>`}
function horseView(){let h=state.horse;const fields=[['Nome',h.name],['Razza',h.breed],['Data di nascita',h.birth?dateText(h.birth):''],['Mantello',h.coat],['Note',h.notes]];
return `<div class="eyebrow">La sua storia</div><h1 class="headline">Il mio cavallo 🐴</h1><p class="intro">La sua scheda personale, sempre con te.</p><div class="hero"><div class="horse-art">${h.photo?`<img src="${esc(h.photo)}" alt="Foto del cavallo">`:'🐴'}</div><div><div class="eyebrow">Il mio cavallo</div><h2>${esc(horseName())}</h2><p>Un posto tutto suo ♡</p></div></div><div class="section-head"><h2>Informazioni</h2><button class="link-btn" data-new="horse">✎ Modifica</button></div><div class="card profile">${fields.map(([k,v])=>`<div class="field-row"><div class="field-name">${k}</div><div class="field-value ${k==='Note'?'notes':''}">${esc(v||'Da compilare')}</div></div>`).join('')}</div><button class="primary wide" data-new="horse">✏️ Personalizza la scheda</button>`}
function agendaView(){const y=shownMonth.getFullYear(),m=shownMonth.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();const dates=new Set(state.appointments.map(a=>a.date));let cal=['L','M','M','G','V','S','D'].map(x=>`<div class="week-day">${x}</div>`).join('');for(let i=0;i<first;i++)cal+='<span class="day blank"></span>';for(let i=1;i<=days;i++){const d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');cal+=`<button class="day ${dates.has(d)?'marked':''} ${d===today()?'today':''} ${selectedDay===d?'chosen':''}" data-day="${d}" aria-label="${dateText(d)}">${i}</button>`}
const list=sortedEvents().filter(a=>!selectedDay||a.date===selectedDay);return `<div class="eyebrow">Non dimenticare nulla</div><h1 class="headline">La mia agenda 📅</h1><p class="intro">Visite, maniscalco, lezioni e momenti speciali.</p><div class="card"><div class="month-row"><button class="month-nav" aria-label="Mese precedente" data-month="-1">‹</button><strong>${new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(shownMonth)}</strong><button class="month-nav" aria-label="Mese successivo" data-month="1">›</button></div><div class="calendar">${cal}</div></div><button class="primary wide" data-new="appointments">＋ Nuovo appuntamento</button><div class="section-head"><h2>${selectedDay?'Appuntamenti del '+shortDate(selectedDay):'Tutti gli appuntamenti'}</h2>${selectedDay?'<button class="link-btn" data-day="">Mostra tutti</button>':'<span class="pill">🌸 La tua agenda</span>'}</div><div class="card">${entries(list,a=>cardItem('🗓️',a.type,shortDate(a.date)+(a.time?' · '+a.time:'')+(a.notes?' · '+a.notes:''),true,'appointments',a.id),'Nessun appuntamento da mostrare.<br>Premi “Nuovo appuntamento” per iniziare.')}</div>`}
function diaryView(){let list=[...state.diary].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="eyebrow">I vostri momenti</div><h1 class="headline">Diario di scuderia 📖</h1><p class="intro">Ogni allenamento e ogni piccolo progresso.</p><button class="primary wide" data-new="diary">＋ Registra un'attività</button><div class="section-head"><h2>Le tue attività</h2><span class="pill">${list.length} registrate</span></div><div class="card">${entries(list,a=>cardItem('🌸',a.type,shortDate(a.date)+(a.duration?' · '+a.duration+' min':'')+(a.notes?' · '+a.notes:''),true,'diary',a.id),'Ancora nessuna attività.<br>Il tuo diario è pronto per la prima pagina!')}</div>`}
function expensesView(){const list=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date));const month=today().slice(0,7),total=list.filter(a=>a.date.startsWith(month)).reduce((s,a)=>s+Number(a.amount||0),0);return `<div class="eyebrow">Tutto sotto controllo</div><h1 class="headline">Le mie spese 💗</h1><p class="intro">Organizza le spese per il tuo cavallo.</p><div class="hero" style="display:block;min-height:0"><div class="eyebrow">Totale del mese</div><h2 style="font-size:34px;margin:9px 0 4px">${euro(total)}</h2><p>Questo mese, per il tuo cavallo 🐴</p></div><button class="primary wide" data-new="expenses">＋ Aggiungi una spesa</button><div class="section-head"><h2>Spese registrate</h2><span class="pill">${list.length} voci</span></div><div class="card">${entries(list,a=>cardItem('🎀',a.category+' · '+euro(a.amount),shortDate(a.date)+(a.notes?' · '+a.notes:''),true,'expenses',a.id),'Non ci sono ancora spese.<br>Aggiungile quando vuoi.')}</div>`}
function render(){renderNav();$('#view').innerHTML=({home:homeView,horse:horseView,agenda:agendaView,diary:diaryView,expenses:expensesView})[tab]();}
function field(label,name,type='text',value='',extra=''){return `<label class="input-group"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(label,name,options,value=''){return `<label class="input-group"><span>${label}</span><select name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
function notes(value=''){return `<label class="input-group"><span>Note (facoltative)</span><textarea name="notes" maxlength="1000" placeholder="Scrivi un ricordo o un dettaglio...">${esc(value)}</textarea></label>`}
let editedKind='',editedId='',newPhoto='';
function openForm(kind,id=''){if(!['horse','appointments','diary','expenses','backup'].includes(kind))return;editedKind=kind;editedId=id;const item=kind==='horse'?state.horse:kind==='backup'?{}:state[kind].find(x=>x.id===id)||{};newPhoto=state.horse.photo||'';let html='',title='';
if(kind==='horse'){title='La scheda del cavallo';html=`<div class="upload">📷 <strong>Foto del tuo cavallo</strong><p class="small-tip">La foto rimane sul tuo dispositivo.</p><input type="file" accept="image/*" id="horsePhoto"><div style="margin-top:9px"><label><input type="checkbox" id="removePhoto"> Rimuovi la foto attuale</label></div></div>`+field('Nome','name','text',item.name||'','required maxlength="60"')+field('Razza','breed','text',item.breed||'','maxlength="70"')+field('Data di nascita','birth','date',item.birth||'')+field('Colore del mantello','coat','text',item.coat||'','maxlength="80"')+notes(item.notes)}
if(kind==='appointments'){title=id?'Modifica appuntamento':'Nuovo appuntamento';html=select('Tipo di appuntamento','type',['Veterinario','Maniscalco','Lezione','Allenamento','Altro'],item.type||'Veterinario')+field('Data','date','date',item.date||today(),'required')+field('Ora (facoltativa)','time','time',item.time||'')+notes(item.notes)}
if(kind==='diary'){title=id?'Modifica attività':'Nuova attività';html=select('Tipo di attività','type',['Lavoro in piano','Passeggiata','Salto','Lavoro da terra','Riposo','Altro'],item.type||'Lavoro in piano')+field('Data','date','date',item.date||today(),'required')+field('Durata (minuti)','duration','number',item.duration||'','min="0" max="1440" step="1" placeholder="Es. 45"')+notes(item.notes)}
if(kind==='expenses'){title=id?'Modifica spesa':'Nuova spesa';html=select('Categoria','category',['Pensione','Veterinario','Maniscalco','Attrezzatura','Lezioni','Altro'],item.category||'Pensione')+field('Data','date','date',item.date||today(),'required')+field('Importo (€)','amount','number',item.amount??'','min="0" max="999999" step="0.01" required placeholder="Es. 25.50"')+notes(item.notes)}
if(kind==='backup'){title='Backup e sicurezza';html=`<div class="soft">I dati vengono salvati solo su questo iPhone, all'interno dell'app. Non sono sincronizzati online. Esporta periodicamente una copia di sicurezza nell'app File.</div><div style="display:grid;gap:10px;margin-top:18px"><button class="primary wide" type="button" id="exportData">⬇ Esporta un backup</button><button class="secondary wide" type="button" id="importData">⬆ Ripristina un backup</button></div><p class="small-tip">Non cancellare l'app dalla schermata Home senza avere prima esportato un backup.</p>`}
else html+=`<button type="submit" class="primary wide">♡ Salva</button>${id?'<div style="height:10px"></div><button class="secondary danger wide" type="button" id="deleteItem">Elimina questa voce</button>':''}`;
$('#modalTitle').textContent=title;$('#entryForm').innerHTML=html;$('#editor').showModal();}
function closeForm(){$('#editor').close()}
$('#closeModal').onclick=closeForm;
$('#editor').addEventListener('click',e=>{if(e.target===$('#editor'))closeForm()});
$('#backupBtn').onclick=()=>openForm('backup');
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;selectedDay='';render();window.scrollTo(0,0)}});
$('#view').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;selectedDay='';render();window.scrollTo(0,0)}else if(b.dataset.new)openForm(b.dataset.new);else if(b.dataset.edit)openForm(b.dataset.edit,b.dataset.id);else if(b.dataset.month){shownMonth.setMonth(shownMonth.getMonth()+Number(b.dataset.month));selectedDay='';render()}else if(b.hasAttribute('data-day')){selectedDay=b.dataset.day;render()}});
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();if(editedKind==='backup')return;const values=Object.fromEntries(new FormData(e.currentTarget).entries());if(editedKind==='horse'){state.horse={name:String(values.name||'').trim().slice(0,60),breed:String(values.breed||'').slice(0,70),birth:String(values.birth||''),coat:String(values.coat||'').slice(0,80),notes:String(values.notes||'').slice(0,1000),photo:$('#removePhoto')?.checked?'':newPhoto};}
else{let obj={id:editedId||uid(),date:String(values.date||today()),notes:String(values.notes||'').slice(0,1000)};if(editedKind==='appointments'){obj.type=String(values.type||'Altro');obj.time=String(values.time||'')}if(editedKind==='diary'){obj.type=String(values.type||'Altro');obj.duration=values.duration?Math.max(0,Math.min(1440,Number(values.duration))):''}if(editedKind==='expenses'){obj.category=String(values.category||'Altro');obj.amount=Math.max(0,Number(values.amount)||0)}const arr=state[editedKind];const i=arr.findIndex(x=>x.id===editedId);if(i>=0)arr[i]=obj;else arr.push(obj)}
if(save()){closeForm();render();notice('Salvato! 💗')}});
$('#entryForm').addEventListener('click',e=>{if(e.target.id==='deleteItem'){if(!confirm('Vuoi davvero eliminare questa voce?'))return;state[editedKind]=state[editedKind].filter(x=>x.id!==editedId);save();closeForm();render();notice('Voce eliminata.')}if(e.target.id==='exportData')exportData();if(e.target.id==='importData')$('#backupInput').click()});
$('#entryForm').addEventListener('change',async e=>{if(e.target.id!=='horsePhoto')return;const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){notice('Scegli una foto.');return}try{const img=await createImageBitmap(f);const ratio=Math.min(1,440/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);newPhoto=c.toDataURL('image/jpeg',.72);$('#removePhoto').checked=false;img.close();notice('Foto pronta! Ricorda di salvare.')}catch{notice('Non riesco a leggere questa foto: scegline un’altra.')}});
function exportData(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),...state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='EquiAgenda-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);notice('Backup creato: salvalo nell’app File.');}
$('#backupInput').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>3_000_000)throw Error('Il file è troppo grande');const raw=JSON.parse(await f.text());if(!raw||!raw.horse||!Array.isArray(raw.appointments)||!Array.isArray(raw.diary)||!Array.isArray(raw.expenses))throw Error('File di backup non valido');if(!confirm('Vuoi sostituire i dati attuali con quelli di questo backup?'))return;const h=raw.horse;state={horse:{name:String(h.name||'').slice(0,60),breed:String(h.breed||'').slice(0,70),birth:String(h.birth||''),coat:String(h.coat||'').slice(0,80),notes:String(h.notes||'').slice(0,1000),photo:typeof h.photo==='string'&&h.photo.startsWith('data:image/')?h.photo:''},appointments:raw.appointments.slice(0,1000).map(x=>({id:String(x.id||uid()),type:String(x.type||'Altro').slice(0,80),date:String(x.date||''),time:String(x.time||''),notes:String(x.notes||'').slice(0,1000)})),diary:raw.diary.slice(0,1000).map(x=>({id:String(x.id||uid()),type:String(x.type||'Altro').slice(0,80),date:String(x.date||''),duration:Number(x.duration)||'',notes:String(x.notes||'').slice(0,1000)})),expenses:raw.expenses.slice(0,1000).map(x=>({id:String(x.id||uid()),category:String(x.category||'Altro').slice(0,80),date:String(x.date||''),amount:Number(x.amount)||0,notes:String(x.notes||'').slice(0,1000)}))};if(save()){closeForm();render();notice('Backup ripristinato! 💗')}}catch(err){notice('Impossibile importare: '+err.message)}});
render();
})();
</script>
</body>
</html>
